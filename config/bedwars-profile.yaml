version: "1.8.9"
profile_name: "Bedwars Visual Safe"
java_version: "8"
platform: "CachyOS/Linux"

# Documentation/template only: OneClient does not import this YAML directly.
profile_type: "visual_only"
instance_isolated: true

runtime:
  java_major: 8
  custom_jvm_args_file: "config/java-opts.txt"

starting_settings:
  render_distance_chunks: 6
  particles: "reduced"
  shaders: "off_during_validation"

mods:
  policy: "verify_each_candidate_before_install"
  install_one_at_a_time: true
  require_explicit_minecraft_1_8_9_release: true
  require_loader_match: true
  require_server_rule_check: true
  binaries_included: false

prohibited_features:
  - "autoclicker"
  - "aim_assistance"
  - "reach_changes"
  - "esp_or_wallhack"
  - "automated_combat_or_bridging"
  - "packet_manipulation_or_anticheat_bypass"

profiles:
  - "Clean Bedwars"
  - "Visual Bedwars"
  - "Tournament Safe"
