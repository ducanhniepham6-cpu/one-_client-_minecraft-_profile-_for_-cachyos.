# Bedwars profile template (documentation only; not imported by OneClient)
version: "1.8.9"
profile_name: "Bedwars 1.8.9 - Clean"
platform: "CachyOS/Linux"

scope: "human-readable setup template; no binaries or launcher integration"
instance:
  isolated: true
  game_version: "1.8.9"
  initial_mods: []

runtime:
  java_major_target: 8
  configure_per_instance: true
  jvm_arguments: "launcher_defaults_first"

starting_graphics:
  render_distance_chunks: 6
  particles: "reduced"
  shaders: "off_for_baseline"

optional_mod_policy:
  add_one_at_a_time: true
  verify_exact_game_version: "1.8.9"
  verify_actual_loader: true
  inspect_dependencies_and_behavior: true
  check_target_server_rules: true
  use_official_project_download: true
  mod_binaries_included: false
  compatibility_claims: "none_without_testing"

visual_goal: "readability and low clutter only"
prohibited_features:
  - "input automation or autoclicking"
  - "aim assistance or reach changes"
  - "ESP, wallhack, or hidden-information overlay"
  - "automated combat or bridging"
  - "packet manipulation or anti-cheat bypass"

profile_variants:
  - "Clean Bedwars: vanilla baseline"
  - "Visual Bedwars: individually verified and server-permitted options only"
  - "Tournament Safe: vanilla or explicitly approved features only"
